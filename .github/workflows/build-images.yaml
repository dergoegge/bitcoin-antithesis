name: Build and Push Config + Workload Images

on:
  schedule:
    - cron: '0 20 */3 * *'  # Every 3 days at 8pm UTC
  workflow_dispatch:  # Allows manual trigger
    inputs:
      node1_branch:
        description: 'Bitcoin branch for node1'
        type: string
        default: 'master'
      node1_repo:
        description: 'Bitcoin repo URL for node1'
        type: string
        default: 'https://github.com/bitcoin/bitcoin.git'
      node1_sanitizers:
        description: 'Sanitizers for node1 (e.g. "thread")'
        type: string
        default: 'thread'
      node2_branch:
        description: 'Bitcoin branch for node2'
        type: string
        default: 'master'
      node2_repo:
        description: 'Bitcoin repo URL for node2'
        type: string
        default: 'https://github.com/bitcoin/bitcoin.git'
      node2_sanitizers:
        description: 'Sanitizers for node2'
        type: string
        default: ''
      node3_branch:
        description: 'Bitcoin branch for node3'
        type: string
        default: 'master'
      node3_repo:
        description: 'Bitcoin repo URL for node3'
        type: string
        default: 'https://github.com/bitcoin/bitcoin.git'
      node3_sanitizers:
        description: 'Sanitizers for node3'
        type: string
        default: 'address'
      workload:
        description: 'Workload config image name'
        type: string
        default: 'initial-rpc-workload'
      container_faults_excluded:
        description: 'Containers excluded from faults (semicolon-separated)'
        type: string
        default: 'health-checker;workload'
      network_faults_excluded:
        description: 'Containers excluded from network faults (semicolon-separated)'
        type: string
        default: 'health-checker;workload'
      node_to_disk_fault:
        description: 'Node to target with disk fault (empty to disable)'
        type: string
        default: ''
      duration:
        description: 'Test run duration in minutes'
        type: string
        default: '1440'
      run_description:
        description: 'Description for the test run'
        type: string
        default: 'CI'

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
    - name: Checkout the code
      uses: actions/checkout@v3

    - name: Install just
      run: |
        apt update && apt install -y curl
        just --version || curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

    - name: Login to Antithesis Docker Registry
      uses: docker/login-action@v3
      with:
        registry: us-central1-docker.pkg.dev
        username: _json_key
        password: ${{ secrets.ANTITHESIS_JSON_LOGIN_KEY }}

    - name: Build and tag images
      env:
        NODE1_BRANCH: ${{ inputs.node1_branch || 'master' }}
        NODE1_REPO: ${{ inputs.node1_repo || 'https://github.com/bitcoin/bitcoin.git' }}
        NODE1_SANITIZERS: ${{ inputs.node1_sanitizers || 'thread' }}
        NODE2_BRANCH: ${{ inputs.node2_branch || 'master' }}
        NODE2_REPO: ${{ inputs.node2_repo || 'https://github.com/bitcoin/bitcoin.git' }}
        NODE2_SANITIZERS: ${{ inputs.node2_sanitizers }}
        NODE3_BRANCH: ${{ inputs.node3_branch || 'master' }}
        NODE3_REPO: ${{ inputs.node3_repo || 'https://github.com/bitcoin/bitcoin.git' }}
        NODE3_SANITIZERS: ${{ inputs.node3_sanitizers || 'address' }}
      run: docket system prune -f && just no_cache="--no-cache" build-and-tag

    - name: Push images to Antithesis Registry
      run: just push

  launch-run:
    needs: build-and-push
    uses: ./.github/workflows/launch-run.yaml
    with:
      workload: ${{ inputs.workload || 'initial-rpc-workload' }}
      container_faults_excluded: ${{ inputs.container_faults_excluded || 'health-checker;workload' }}
      network_faults_excluded: ${{ inputs.network_faults_excluded || 'health-checker;workload' }}
      node_to_disk_fault: ${{ inputs.node_to_disk_fault || '' }}
      duration: ${{ inputs.duration || '1440' }}
      run_description: ${{ inputs.run_description || 'Scheduled 24h run (every 3 days)' }}
      is_ephemeral: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    secrets: inherit
