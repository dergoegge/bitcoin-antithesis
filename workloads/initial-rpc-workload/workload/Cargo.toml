[package]
name = "bitcoin-antithesis-workload"
version = "0.1.0"
edition = "2021"

[dependencies]
antithesis_sdk = "0.2"
jsonrpc = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitcoin-capnp-types = { git = "https://github.com/dergoegge/bitcoin-capnp-types.git", branch = "updated-capnp-files" }
capnp = "0.25"
capnp-rpc = "0.25"
tokio = { version = "1", features = ["rt", "net", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
bitcoin = "0.32"

[[bin]]
name = "parallel_driver_tx_simple"
path = "src/bin/parallel_driver_tx_simple.rs"

