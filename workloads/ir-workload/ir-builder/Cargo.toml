[package]
name = "ir-builder"
version.workspace = true
edition.workspace = true

[dependencies]
antithesis_sdk = "0.2"
bitcoin = "0.32"
jsonrpc = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

fuzzamoto = { path = "../fuzzamoto", features = ["reduced_pow"] }
fuzzamoto-ir = { path = "../fuzzamoto-ir", features = ["reduced_pow"] }
rand = { version = "0.8.5", features = ["small_rng"] }
