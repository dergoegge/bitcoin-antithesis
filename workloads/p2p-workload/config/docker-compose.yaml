services:
  # The node under test. The only peer it ever sees is the adversary.
  node1:
    container_name: node1
    hostname: node1
    image: bitcoin-node1:antithesis
    build:
      context: ../../../images/bitcoin
      dockerfile: Dockerfile
      network: host
      args:
        - BITCOIN_BRANCH=${NODE1_BRANCH:-master}
        - BITCOIN_REPO=${NODE1_REPO:-https://github.com/bitcoin/bitcoin.git}
        - SANITIZERS=${NODE1_SANITIZERS:-thread}
    command:
      - "-regtest"
      - "-datadir=/data"
      - "-rpcallowip=0.0.0.0/0"
      - "-rpcbind=0.0.0.0"
      - "-rpcuser=user"
      - "-rpcpassword=password"
      - "-server=1"
      - "-listen=1"
      - "-listenonion=0"
      - "-loglevelalways=1"
      - "-debug"
      - "-debugexclude=libevent"
      - "-debugexclude=leveldb"
      - "-printtoconsole=0"
    volumes:
      - ./volumes/node1:/data

  # Owns the P2P connections to node1 and does what the drivers tell it to.
  # The drivers run in this container (/opt/antithesis/test/v1/main).
  adversary:
    container_name: adversary
    hostname: adversary
    image: p2p-workload-adversary:antithesis
    build:
      context: ..
      dockerfile: adversary/Dockerfile
      network: host
      args:
        - BITCOIN_BRANCH=${NODE1_BRANCH:-master}
        - BITCOIN_REPO=${NODE1_REPO:-https://github.com/bitcoin/bitcoin.git}
    depends_on:
      - node1
    environment:
      - NODE1_P2P_ADDR=node1:18444
      - ADVERSARY_PORT=9000
      - ADVERSARY_MAX_CONNECTIONS=16
      - ADVERSARY_LOG_LEVEL=DEBUG
      # For the drivers, which run here and talk to the server over loopback.
      - ADVERSARY_HOST=127.0.0.1
      # Has to stay below the test run's duration, or the eventually driver is
      # stopped before it asserts anything.
      - EVENTUALLY_RETRY_BUDGET_SECS=3600

  # Waits for node1 and the adversary, signals setup_complete and exits.
  health-checker:
    container_name: health-checker
    hostname: health-checker
    image: p2p-workload-adversary:antithesis
    build:
      context: ..
      dockerfile: adversary/Dockerfile
      network: host
      args:
        - BITCOIN_BRANCH=${NODE1_BRANCH:-master}
        - BITCOIN_REPO=${NODE1_REPO:-https://github.com/bitcoin/bitcoin.git}
    entrypoint: ["python3", "/health_checker.py"]
    depends_on:
      - node1
      - adversary
    environment:
      - NODE1_RPC_URL=http://user:password@node1:18443
      - ADVERSARY_HOST=adversary
      - ADVERSARY_PORT=9000
